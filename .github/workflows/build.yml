name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
      - name: Build, test, and audit
        shell: cmd
        run: |
          call tools\build.bat
          set "CAE_RESULT=%ERRORLEVEL%"
          type tools\build.log
          exit /b %CAE_RESULT%
      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -AllowDirty
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ConditionalArrowEmbedding-${{ github.sha }}
          path: build/release/packages/*
          if-no-files-found: error
